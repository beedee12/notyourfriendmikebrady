name: Build Ship Explorer Stereo Fix V2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout UEVR headers only
        uses: actions/checkout@v4
        with:
          repository: praydog/UEVR
          ref: 4ee5c6b6162dee2291fc75f9dfc57667f6d45a2d
          path: UEVR
          submodules: false
          fetch-depth: 1
      - name: Build DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++latest /EHsc /LD /I"%GITHUB_WORKSPACE%\UEVR\include" "%GITHUB_WORKSPACE%\Plugin.cpp" /Fe:"%GITHUB_WORKSPACE%\ShipExplorerStereoFixV2.dll"
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ShipExplorerStereoFixV2
          path: ShipExplorerStereoFixV2.dll
