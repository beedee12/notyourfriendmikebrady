name: Build Ship Explorer Stereo Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout exact UEVR source
        uses: actions/checkout@v4
        with:
          repository: praydog/UEVR
          ref: 4ee5c6b6162dee2291fc75f9dfc57667f6d45a2d
          path: UEVR
          submodules: recursive
          fetch-depth: 1

      - name: Put Ship Explorer fix into UEVR example plugin target
        shell: pwsh
        run: |
          Copy-Item -Force "${{ github.workspace }}\Plugin.cpp" "${{ github.workspace }}\UEVR\examples\example_plugin\Plugin.cpp"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S "${{ github.workspace }}\UEVR" -B "${{ github.workspace }}\build" -A x64

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build "${{ github.workspace }}\build" --config Release --target example_plugin

      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem "${{ github.workspace }}\build" -Recurse -Filter "example_plugin.dll" | Select-Object -First 1
          if (-not $dll) { throw "example_plugin.dll was not produced" }
          New-Item -ItemType Directory -Force "${{ github.workspace }}\artifact" | Out-Null
          Copy-Item $dll.FullName "${{ github.workspace }}\artifact\ShipExplorerStereoFix.dll"

      - name: Upload finished DLL
        uses: actions/upload-artifact@v4
        with:
          name: ShipExplorerStereoFix
          path: artifact/ShipExplorerStereoFix.dll
